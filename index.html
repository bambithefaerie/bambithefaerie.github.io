<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --green:#1E3326;
    --green-lift:#25402F;
    --gold:#C4A44D;
    --gold-soft:rgba(196,164,77,.72);
    --gold-line:rgba(196,164,77,.28);
    --card:rgba(196,164,77,.055);
    --card-hover:rgba(196,164,77,.115);
  }
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100svh;
    background:var(--green);
    color:var(--gold);
    font-family:'Alice',Georgia,serif;
    display:flex;justify-content:center;
    padding:clamp(2.5rem,9vw,4.5rem) 1.35rem clamp(3rem,10vw,5rem);
    position:relative;overflow-x:hidden;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:3;pointer-events:none;
    background:
      radial-gradient(60% 40% at 20% 4%, rgba(196,164,77,.11) 0%, transparent 62%),
      radial-gradient(52% 38% at 86% 22%, rgba(196,164,77,.075) 0%, transparent 60%),
      radial-gradient(75% 48% at 50% 105%, var(--green-lift) 0%, transparent 72%);
  }
  .dust{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .dust i{
    position:absolute;display:block;width:3px;height:3px;border-radius:50%;
    background:#EBE6DD;
    box-shadow:0 0 6px 1px rgba(235,230,221,.55), 0 0 16px 4px rgba(196,164,77,.42);
    opacity:0;animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translateY(14vh) scale(.6);opacity:0}
    12%{opacity:.9} 80%{opacity:.45}
    100%{transform:translateY(-95vh) scale(1.1);opacity:0}
  }
  main{position:relative;z-index:1;width:100%;max-width:26.5rem;text-align:center}

  .hero{
    width:min(25rem,108%);margin:0 auto -.4rem;
  }
  .hero img{width:100%;height:auto;display:block}
  h1{
    font-family:'Alice',Georgia,serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:clamp(1.5rem,6.1vw,1.92rem);
    letter-spacing:.135em;
    line-height:1.25;
    color:var(--gold);
  }
  .tagline{
    margin-top:1rem;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.28rem,5.4vw,1.5rem);
    line-height:1.4;
    color:var(--gold);
  }
  .intro{
    margin-top:1.15rem;
    font-family:'Alice',Georgia,serif;
    font-size:.925rem;
    line-height:1.72;
    color:var(--gold-soft);
  }

  .rule{display:flex;align-items:center;justify-content:center;gap:.8rem;margin:2.1rem 0 1.65rem;color:var(--gold)}
  .rule::before,.rule::after{content:"";height:1px;flex:1;background:var(--gold-line)}
  .rule span{font-size:.72rem;letter-spacing:.3em}

  nav{display:flex;flex-direction:column;gap:.72rem}
  a.link{
    display:flex;align-items:center;gap:.95rem;
    padding:1.02rem 1.25rem;
    border:1px solid var(--gold-line);
    border-radius:1.05rem;
    background:var(--card);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    color:var(--gold);text-decoration:none;
    font-family:'Cinzel',serif;
    font-size:.9rem;font-weight:500;letter-spacing:.075em;
    transition:transform .28s cubic-bezier(.2,.8,.3,1), background .28s ease, box-shadow .28s ease, border-color .28s ease;
  }
  a.link:hover,a.link:focus-visible{
    transform:translateY(-2px);
    background:var(--card-hover);
    border-color:rgba(196,164,77,.62);
    box-shadow:0 16px 30px -18px #000, 0 0 22px -8px rgba(196,164,77,.35);
    outline:none;
  }
  a.link svg{width:1.18rem;height:1.18rem;flex:none;color:var(--gold-soft);transition:color .28s ease}
  a.link:hover svg{color:var(--gold)}
  .label{flex:1;text-align:left;line-height:1.3}
  .sub{
    display:block;margin-top:.15rem;
    font-family:'Alice',Georgia,serif;
    font-size:.79rem;letter-spacing:.055em;color:var(--gold-soft);text-transform:none;
  }
  .arrow{opacity:.45;font-size:.9rem;transition:transform .28s ease,opacity .28s ease}
  a.link:hover .arrow{opacity:.9;transform:translateX(3px)}
  a.link.soon{pointer-events:none;background:transparent;border-style:dashed;opacity:.62}
  a.link.soon .arrow{display:none}

  footer{
    margin-top:2.7rem;
    font-family:'Cinzel',serif;
    font-size:.66rem;letter-spacing:.26em;color:var(--gold-soft);opacity:.8;
  }

  @media (prefers-reduced-motion:reduce){
    .dust{display:none} a.link{transition:none} a.link:hover{transform:none}
  }
</style>
</head>

<script>
  (function(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var d = document.getElementById('dust');
    for (var i=0;i<26;i++){
      var s = document.createElement('i');
      s.style.left = (Math.random()*100).toFixed(2) + '%';
      s.style.bottom = '-4vh';
      s.style.animationDuration = (13 + Math.random()*16).toFixed(1) + 's';
      s.style.animationDelay = (-Math.random()*26).toFixed(1) + 's';
      s.style.transform = 'scale(' + (0.5 + Math.random()*1.1).toFixed(2) + ')';
      d.appendChild(s);
    }
  })();
