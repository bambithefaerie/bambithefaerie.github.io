<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cream:#FBF6F0; --ink:#3A322E; --ink-soft:#7B6E66;
    --line:rgba(58,50,46,.13); --card:rgba(255,255,255,.58); --card-hover:rgba(255,255,255,.92);
    --blush:#F3DCD4; --lilac:#E4DCEE; --gold:#C9A227;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100svh; background:var(--cream); color:var(--ink);
    font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:300;
    display:flex; justify-content:center;
    padding:clamp(2.5rem,9vw,4.5rem) 1.35rem clamp(3rem,10vw,5rem);
    position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(58% 42% at 18% 6%, var(--blush) 0%, transparent 62%),
      radial-gradient(52% 40% at 88% 24%, var(--lilac) 0%, transparent 60%),
      radial-gradient(70% 45% at 50% 104%, #EFE4D8 0%, transparent 70%);
    opacity:.85;
  }
  .dust{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .dust i{
    position:absolute;display:block;width:3px;height:3px;border-radius:50%;background:#fff;
    box-shadow:0 0 6px 1px rgba(255,255,255,.9), 0 0 14px 3px rgba(201,162,39,.18);
    opacity:0;animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translateY(14vh) scale(.6);opacity:0}
    12%{opacity:.85} 80%{opacity:.5}
    100%{transform:translateY(-95vh) scale(1.1);opacity:0}
  }
  main{position:relative;z-index:1;width:100%;max-width:26.5rem;text-align:center}
  .avatar{
    width:clamp(6.5rem,26vw,7.75rem);aspect-ratio:1;margin:0 auto 1.5rem;border-radius:50%;
    background:linear-gradient(150deg,var(--blush),var(--lilac));
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 12px 34px -14px rgba(58,50,46,.32), 0 0 0 7px rgba(255,255,255,.42);
    object-fit:cover;display:grid;place-items:center;
    font-family:'Cormorant Garamond',serif;font-size:2.5rem;color:rgba(255,255,255,.95);
  }
  h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(2.15rem,9.5vw,2.7rem);letter-spacing:.005em;line-height:1.05}
  .tagline{margin-top:.85rem;font-size:.815rem;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-soft);line-height:1.85}
  .intro{margin-top:1.05rem;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.12rem;line-height:1.55;color:var(--ink-soft)}
  .rule{display:flex;align-items:center;justify-content:center;gap:.7rem;margin:2rem 0 1.6rem;color:var(--gold)}
  .rule::before,.rule::after{content:"";height:1px;flex:1;background:var(--line)}
  .rule span{font-size:.7rem;letter-spacing:.3em}
  nav{display:flex;flex-direction:column;gap:.72rem}
  a.link{
    display:flex;align-items:center;gap:.95rem;padding:1.02rem 1.25rem;
    border:1px solid var(--line);border-radius:1.05rem;background:var(--card);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    color:var(--ink);text-decoration:none;font-size:.945rem;letter-spacing:.055em;
    transition:transform .28s cubic-bezier(.2,.8,.3,1), background .28s ease, box-shadow .28s ease, border-color .28s ease;
    box-shadow:0 1px 2px rgba(58,50,46,.04);
  }
  a.link:hover,a.link:focus-visible{
    transform:translateY(-2px);background:var(--card-hover);
    border-color:rgba(201,162,39,.42);box-shadow:0 14px 28px -16px rgba(58,50,46,.38);outline:none;
  }
  a.link svg{width:1.18rem;height:1.18rem;flex:none;color:var(--ink-soft);transition:color .28s ease}
  a.link:hover svg{color:var(--gold)}
  .label{flex:1;text-align:left}
  .sub{font-size:.735rem;letter-spacing:.11em;color:var(--ink-soft);text-transform:uppercase}
  .arrow{opacity:.35;font-size:.9rem;transition:transform .28s ease,opacity .28s ease}
  a.link:hover .arrow{opacity:.75;transform:translateX(3px)}
  a.link.soon{pointer-events:none;background:transparent;border-style:dashed;color:var(--ink-soft)}
  a.link.soon .arrow{display:none}
  footer{margin-top:2.6rem;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);opacity:.72}
  @media (prefers-reduced-motion:reduce){
    .dust{display:none} a.link{transition:none} a.link:hover{transform:none}
  }
</style>

<script>

    for (var i=0;i<26;i++){
      var s = document.createElement('i');
      s.style.left = (Math.random()*100).toFixed(2) + '%';
      s.style.bottom = '-4vh';
